services:
  - type: web
    name: safeher-ai-backend
    env: python
    rootDir: backend
    buildCommand: if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install -r backend/requirements.txt; fi
    startCommand: sh -c 'if [ -f manage.py ]; then python manage.py migrate && gunicorn safeher_ai.wsgi:application --bind 0.0.0.0:$PORT; else cd backend && python manage.py migrate && gunicorn safeher_ai.wsgi:application --bind 0.0.0.0:$PORT; fi'
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: safeher-db
          property: connectionString

databases:
  - name: safeher-db
    databaseName: safeher
    user: safeher_user