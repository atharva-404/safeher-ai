services:
  - type: web
    name: safeher-ai-backend
    env: python
    rootDir: backend
    buildCommand: if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install -r backend/requirements.txt; fi
    startCommand: ./start.sh
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONIOENCODING
        value: utf-8
      - key: DATABASE_URL
        fromDatabase:
          name: safeher-db
          property: connectionString

databases:
  - name: safeher-db
    databaseName: safeher
    user: safeher_user