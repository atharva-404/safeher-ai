services:
  - type: web
    name: safeher-ai-backend
    env: python
    rootDir: backend
    buildCommand: if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install -r backend/requirements.txt; fi
    startCommand: if [ -f manage.py ]; then gunicorn safeher_ai.wsgi:application --bind 0.0.0.0:$PORT; else cd backend && gunicorn safeher_ai.wsgi:application --bind 0.0.0.0:$PORT; fi
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.9"